<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <title>Little List — To-do list</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #242a24;
      background: #f5f4ef;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 12% 12%, rgba(201, 218, 183, 0.34), transparent 34%),
        radial-gradient(ellipse at 88% 84%, rgba(241, 214, 174, 0.25), transparent 32%),
        #f5f4ef;
    }

    .todo-card {
      width: min(100%, 520px);
      padding: 38px;
      border: 1px solid rgba(36, 42, 36, 0.08);
      border-radius: 24px;
      background: rgba(255, 255, 252, 0.94);
      box-shadow: 0 24px 70px rgba(37, 45, 34, 0.09);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #75836d;
      font-size: 0.75rem;
      font-weight: 750;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.4rem, 8vw, 3.2rem);
      font-weight: 500;
      letter-spacing: -0.055em;
      line-height: 1;
    }

    .subtitle {
      margin: 13px 0 29px;
      color: #777d73;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .add-form {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .task-input {
      min-width: 0;
      flex: 1;
      padding: 13px 15px;
      border: 1px solid #e1e4dc;
      border-radius: 12px;
      outline: none;
      background: #fff;
      color: inherit;
      font: inherit;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .task-input::placeholder {
      color: #a4a99f;
    }

    .task-input:focus {
      border-color: #829578;
      box-shadow: 0 0 0 3px rgba(130, 149, 120, 0.16);
    }

    .add-button {
      padding: 0 19px;
      border: 0;
      border-radius: 12px;
      background: #40563c;
      color: #fff;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    .add-button:hover {
      background: #31452e;
    }

    .add-button:active {
      transform: translateY(1px);
    }

    .add-button:focus-visible,
    .task-input:focus-visible,
    .task-checkbox:focus-visible + .task-label,
    .delete-button:focus-visible {
      outline: 3px solid rgba(91, 123, 80, 0.38);
      outline-offset: 3px;
    }

    .list-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px 11px;
      border-bottom: 1px solid #eceee8;
      color: #73796f;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .task-list {
      display: grid;
      gap: 3px;
      margin: 0;
      padding: 8px 0 0;
      list-style: none;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 48px;
      padding: 8px 10px;
      border-radius: 10px;
      animation: arrive 180ms ease-out both;
    }

    .task-item:hover {
      background: #f7f8f4;
    }

    .task-checkbox {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      margin: 0;
      accent-color: #526b4b;
      cursor: pointer;
    }

    .task-label {
      flex: 1;
      overflow-wrap: anywhere;
      color: #3b4239;
      font-size: 0.96rem;
      line-height: 1.45;
      cursor: pointer;
    }

    .delete-button {
      flex: 0 0 auto;
      padding: 6px 9px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #73796f;
      font: inherit;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .delete-button:hover {
      background: #f3e8e4;
      color: #8a3f32;
    }

    .task-item.is-done .task-label {
      color: #999e94;
      text-decoration: line-through;
      text-decoration-color: #afb6a9;
    }

    .empty-state {
      padding: 24px 10px 14px;
      color: #92988d;
      font-size: 0.9rem;
      text-align: center;
    }

    .task-count {
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
      text-transform: none;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      body {
        padding: 24px 14px;
      }

      .todo-card {
        padding: 29px 22px;
        border-radius: 20px;
      }

      .add-button {
        padding: 0 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="todo-card">
    <p class="eyebrow">A little more focus</p>
    <h1>Little List</h1>
    <p class="subtitle">Make space for what matters, one task at a time.</p>

    <form class="add-form" id="add-form">
      <label for="task-input" hidden>Add a task</label>
      <input
        class="task-input"
        id="task-input"
        name="task"
        type="text"
        placeholder="What needs doing?"
        autocomplete="off"
        required
      >
      <button class="add-button" type="submit">Add task</button>
    </form>

    <section aria-labelledby="list-heading">
      <div class="list-heading" id="list-heading">
        <span>Your tasks</span>
        <span class="task-count" id="task-count" aria-live="polite">0 tasks left</span>
      </div>
      <ul class="task-list" id="task-list" aria-label="To-do tasks"></ul>
      <p class="empty-state" id="empty-state">Your list is clear. Add a task to get started.</p>
    </section>
  </main>

  <script>
    const form = document.querySelector("#add-form");
    const input = document.querySelector("#task-input");
    const list = document.querySelector("#task-list");
    const count = document.querySelector("#task-count");
    const emptyState = document.querySelector("#empty-state");
    let taskId = 0;

    function updateTaskCount() {
      const remaining = list.querySelectorAll(".task-checkbox:not(:checked)").length;
      count.textContent = `${remaining} ${remaining === 1 ? "task" : "tasks"} left`;
      emptyState.hidden = list.children.length > 0;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const taskText = input.value.trim();
      if (!taskText) {
        input.focus();
        return;
      }

      taskId += 1;
      const item = document.createElement("li");
      item.className = "task-item";

      const checkbox = document.createElement("input");
      checkbox.className = "task-checkbox";
      checkbox.type = "checkbox";
      checkbox.id = `task-${taskId}`;
      checkbox.addEventListener("change", () => {
        item.classList.toggle("is-done", checkbox.checked);
        updateTaskCount();
      });

      const label = document.createElement("label");
      label.className = "task-label";
      label.htmlFor = checkbox.id;
      label.textContent = taskText;

      const deleteButton = document.createElement("button");
      deleteButton.className = "delete-button";
      deleteButton.type = "button";
      deleteButton.textContent = "Delete";
      deleteButton.setAttribute("aria-label", `Delete task: ${taskText}`);
      deleteButton.addEventListener("click", () => {
        item.remove();
        updateTaskCount();
      });

      item.append(checkbox, label, deleteButton);
      list.append(item);
      input.value = "";
      input.focus();
      updateTaskCount();
    });
  </script>
</body>
</html>
